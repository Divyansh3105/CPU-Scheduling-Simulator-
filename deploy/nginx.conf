# nginx server block for the simulator behind PHP-FPM. Adjust server_name, root, certificates and the
# fastcgi_pass socket for your host, then include it from nginx.conf.
#
# `add_header ... always` keeps the headers on error responses too. nginx drops parent add_header
# directives inside any location that defines its own, so the shared set is repeated via an include.

# Optional second layer in front of the PHP limiter (http {} context):
# limit_req_zone $binary_remote_addr zone=cpusim_api:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;
    root /var/www/cpu-scheduling-simulator/public;   # the public/ folder only
    index index.html;

    ssl_certificate     /etc/ssl/certs/example.com.pem;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    include /etc/nginx/snippets/cpusim-headers.conf;   # see the block at the bottom of this file

    # Only the two endpoints reach PHP. Everything else ending in .php is not served.
    location ~ ^/api/(simulate|simulate_hypervisor)\.php$ {
        # limit_req zone=cpusim_api burst=40 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # fastcgi_param RATE_LIMIT_PER_MIN 300;
        # fastcgi_param RATE_LIMIT_IP_HEADER HTTP_X_FORWARDED_FOR;   # only behind a trusted proxy
        fastcgi_pass unix:/run/php/php-fpm.sock;
        include /etc/nginx/snippets/cpusim-headers.conf;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }

    # Fonts never change without a rename.
    location ~* \.woff2$ {
        include /etc/nginx/snippets/cpusim-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

# ---- /etc/nginx/snippets/cpusim-headers.conf ----

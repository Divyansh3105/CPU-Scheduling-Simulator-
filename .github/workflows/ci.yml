name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run PHP checks
        run: php tests/check.php
      - name: Syntax-check JS
        run: for f in public/assets/js/*.js public/assets/js/engine/*.js; do node --check "$f"; done
      - name: JS engine matches PHP
        run: node tests/parity.mjs
      - name: Browser smoke test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run PHP checks
        run: php tests/check.php
      - name: Syntax-check JS
        run: for f in public/assets/js/*.js public/assets/js/engine/*.js; do node --check "$f"; done
      - name: JS engine matches PHP
        run: node tests/parity.mjs
      - name: Browser smoke test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
